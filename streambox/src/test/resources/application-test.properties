# ===================================================================
# Perfil TEST: se activa con @ActiveProfiles("test") en los tests.
# Se SUMA a application.properties (open-in-view=false, zona horaria...)
# y solo sobrescribe lo necesario: base de datos H2 en memoria y JWT.
# ===================================================================
spring.datasource.url=jdbc:h2:mem:streambox;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# El esquema sale de las migraciones de Flyway (las mismas que en producción)
# y Hibernate lo valida contra las entidades (ddl-auto=validate, heredado).

# Secreto fijo y exclusivo de tests (no es un secreto real). Evita que los
# tests dependan de la variable de entorno JWT_SECRET de cada máquina.
jwt.secret=secreto-solo-para-tests-de-streambox-0123456789
jwt.access-token-ttl=15m

# Sin limpieza programada de refresh tokens: borraría filas a mitad de un test.
# La prueba que la comprueba la activa con @TestPropertySource.
streambox.auth.refresh.cleanup.enabled=false

# Límites muy altos para que las suites normales no se vean afectadas
# (todas las peticiones de MockMvc comparten la IP 127.0.0.1). Las pruebas del
# rate limiting sobrescriben estos valores con @TestPropertySource.
streambox.security.rate-limit.login.max-requests=100000
streambox.security.rate-limit.register.max-requests=100000
streambox.security.rate-limit.refresh.max-requests=100000
streambox.security.rate-limit.lockout.max-failures=100000

# Nunca se crea un administrador automático en los tests.
streambox.admin.email=
streambox.admin.password=
