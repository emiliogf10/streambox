# ===================================================================
# Perfil TEST: se activa con @ActiveProfiles("test") en los tests.
# Se SUMA a application.properties (open-in-view=false, zona horaria...)
# y solo sobrescribe lo necesario: base de datos H2 en memoria y JWT.
# ===================================================================
# Una base H2 PROPIA para cada contexto de Spring: ${random.value} se resuelve
# una vez por Environment, es decir, por contexto (la caché de contextos usa la
# configuración declarada, no este valor, así que se siguen reutilizando).
# Por qué no una base compartida (antes, jdbc:h2:mem:streambox): H2 2.4.240
# compila un CHECK con IN de constantes (CK_USERS_ROLE, purpose...) en un
# TreeSet cuyo comparador es la SESIÓN que ejecutó el CREATE, es decir, la
# conexión de Flyway del primer contexto (en 2.3.232 era el CompareMode de la
# base). Cuando la caché de contextos (32) expulsaba ese contexto, su pool de
# Hikari cerraba la conexión y, desde entonces, cualquier INSERT en users de
# cualquier otro contexto fallaba con «Check constraint invalid» causado por
# «The database has been closed» (105 errores con Docker en Windows). Con una
# base por contexto, el esquema lo crea el pool de ese mismo contexto y muere
# con él: ningún contexto depende del ciclo de vida de otro. Además aísla mejor
# los datos entre contextos. Lo prueba TestDatabasePerContextIntegrationTest.
spring.datasource.url=jdbc:h2:mem:streambox_${random.value};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# Por el mismo fallo de H2, la conexión física que ejecutó las migraciones
# tiene que vivir tanto como su contexto. Hikari jubila cada conexión a los
# 30 min (max-lifetime por defecto) y un contexto cacheado puede reutilizarse
# más tarde en una suite lenta; 0 = sin caducidad. Solo afecta a los tests.
spring.datasource.hikari.max-lifetime=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# El esquema sale de las migraciones de Flyway (las mismas que en producción)
# y Hibernate lo valida contra las entidades (ddl-auto=validate, heredado).

# Secreto fijo y exclusivo de tests (no es un secreto real). Evita que los
# tests dependan de la variable de entorno JWT_SECRET de cada máquina.
jwt.secret=secreto-solo-para-tests-de-streambox-0123456789
jwt.access-token-ttl=15m

# Sin limpieza programada de refresh tokens: borraría filas a mitad de un test.
# La prueba que la comprueba la activa con @TestPropertySource.
streambox.auth.refresh.cleanup.enabled=false
# Igual con la de las reservas de nombre caducadas (los tests mueven el reloj
# de la aplicación). La prueba que la comprueba la activa con @TestPropertySource.
streambox.username-reservations.cleanup.enabled=false

# Límites muy altos para que las suites normales no se vean afectadas
# (todas las peticiones de MockMvc comparten la IP 127.0.0.1). Las pruebas del
# rate limiting sobrescriben estos valores con @TestPropertySource.
streambox.security.rate-limit.login.max-requests=100000
streambox.security.rate-limit.register.max-requests=100000
streambox.security.rate-limit.refresh.max-requests=100000
streambox.security.rate-limit.email-verification.max-requests=100000
streambox.security.rate-limit.email-verification-resend.max-requests=100000
streambox.security.rate-limit.password-reset.max-requests=100000
streambox.security.rate-limit.password-reset-confirm.max-requests=100000
streambox.security.rate-limit.lockout.max-failures=100000

# Correo: con el perfil test los correos van a MemoryEmailSender (bandeja en
# memoria). Envío síncrono: al confirmar la transacción el correo ya está en la
# bandeja, y los tests lo leen sin esperas. El envío asíncrono real lo prueba
# EmailAsyncDispatchIntegrationTest con streambox.email.async=true.
streambox.email.async=false
# URL pública de prueba (los tests comprueban que el enlace la usa).
streambox.public-url=https://streambox.test
# Sin el límite de 60 s entre correos de una misma cuenta: las suites que
# registran y reenvían seguido no prueban ese límite. Lo prueba
# EmailVerificationIntegrationTest con @TestPropertySource.
streambox.email.resend.min-interval=0s
streambox.email.resend.max-per-window=100000

# Nunca se crea un administrador automático en los tests.
streambox.admin.email=
streambox.admin.password=
