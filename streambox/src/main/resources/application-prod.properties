# ===================================================================
# Perfil PROD: producción.
# Activar con SPRING_PROFILES_ACTIVE=prod
#
# Variables de entorno obligatorias:
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET
#
# El esquema lo crea y actualiza Flyway al arrancar (db/migration).
# Opcional: ADMIN_EMAIL y ADMIN_PASSWORD para crear el primer administrador
# (ver AdminAccountInitializer).
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Sin SQL en los logs (puede contener datos personales).
spring.jpa.show-sql=false

# La documentación de la API no se publica en producción.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Mensajes y trazas de error: no hace falta nada aquí. Los errores de /error los
# escribe ApiErrorController, que nunca incluye el mensaje de la excepción ni la
# traza, y el bloque spring.web.error.include-* de application.properties los
# deja a "never" en todos los perfiles como defensa extra. (Las antiguas
# server.error.include-* que había aquí no hacían nada en Spring Boot 4: el
# prefijo pasó a ser spring.web.error.)

# Detrás de un proxy inverso (nginx, un balanceador...) la IP real del cliente
# llega en X-Forwarded-For. Con "native" Tomcat la interpreta, y el límite por
# IP (RateLimitingFilter) funciona con la IP del cliente y no con la del proxy.
# SOLO activar si la aplicación es accesible únicamente a través de ese proxy:
# si no, un cliente podría falsificar la cabecera y evadir el límite.
server.forward-headers-strategy=native

# Al apagar, termina las peticiones en curso.
server.shutdown=graceful

# Logs en JSON (formato ECS: timestamp, nivel, logger, mensaje, traza...), un
# objeto por línea. Lo leen directamente Loki, ELK, CloudWatch, etc. sin tener
# que interpretar texto libre. En dev se mantiene el formato legible.
logging.structured.format.console=ecs
logging.level.root=INFO
