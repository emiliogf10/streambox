# ===================================================================
# Perfil DEV (por defecto): desarrollo local.
# ===================================================================

# El esquema lo crea Flyway al arrancar (ver db/migration). Para cambiar el
# modelo: modifica la entidad Y añade una migración nueva (V2__..., V3__...).
# No modifiques una migración ya aplicada: Flyway lo detecta y se niega a arrancar.

# Muestra el SQL generado para depurar consultas.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI y OpenAPI disponibles en http://localhost:8080/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
