# ===================================================================
# Configuración COMÚN a todos los entornos.
# Lo específico de cada entorno está en application-{perfil}.properties:
#   - dev  (por defecto): desarrollo local
#   - prod               : producción
#   - test               : tests automatizados (ver src/test/resources)
# Para elegir perfil:  --spring.profiles.active=prod
#                  o   SPRING_PROFILES_ACTIVE=prod
# ===================================================================
spring.application.name=streambox
spring.profiles.default=dev

# Credenciales locales (ignorado por git, ver application-local.properties.example)
spring.config.import=optional:classpath:application-local.properties

# Base de datos (PostgreSQL). Usuario y contraseña van en application-local.properties
# (desarrollo) o en variables de entorno (producción).
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/streambox

# El esquema lo gestiona Flyway (src/main/resources/db/migration). Hibernate
# solo lo valida (ddl-auto=validate en dev, prod y test): si una entidad no
# coincide con las migraciones, la aplicación no arranca.
# baseline-on-migrate + baseline-version=0 permite adoptar una base de datos
# que ya existía sin Flyway: V1 es idempotente y completa lo que falte.
# Ubicaciones: las migraciones (comunes) y los callbacks propios de cada motor.
# {vendor} lo sustituye Spring Boot por postgresql o h2 según la base conectada:
# db/callback/postgresql/afterMigrate__close_public_api.sql cierra la API pública
# de Supabase tras cada migrate; con H2 (tests) no existe ubicación y no se
# ejecuta nada (fail-on-missing-locations es false por defecto).
spring.flyway.locations=classpath:db/migration,classpath:db/callback/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate

# Las colecciones de carga diferida (por ejemplo los géneros de cada película) se
# cargan por lotes de hasta 50: una página de películas necesita una consulta
# extra para todos sus géneros en lugar de una por película (problema N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON de entrada: un decimal en un campo entero (p. ej. "duration": 100.5)
# se rechaza con 400 MALFORMED_REQUEST en lugar de truncarse en silencio a 100,
# que guardaría algo distinto de lo enviado (incidencia QA-1). Por defecto
# Jackson acepta y trunca (ACCEPT_FLOAT_AS_INT=true). Aplica al JsonMapper de
# Jackson 3 (tools.jackson) que Spring Boot 4 autoconfigura y que usan los
# controladores para leer los cuerpos; el ObjectMapper de Jackson 2 de
# SecurityErrorResponseWriter solo escribe respuestas y no le afecta.
# Afecta a todos los enteros del cuerpo (Integer, int, Long: también genreIds).
# "100" sigue valiendo; "100.0" se rechaza (en JSON es un número decimal). Los
# parámetros de consulta (?page=1) no cambian: los convierte Spring, no Jackson.
spring.jackson.deserialization.accept-float-as-int=false

# Sin multipart: la API no tiene ninguna subida de archivos (todo es JSON y las
# portadas son URLs), así que no se registra el MultipartResolver ni la
# configuración multipart del servlet. Con ella activa (lo que hace Spring Boot
# por defecto), DispatcherServlet analizaba cualquier multipart/form-data
# (hasta 10 MB por petición, 1 MB por archivo, con ficheros temporales en disco)
# ANTES de descubrir que el endpoint no lo acepta (415). Lo podía hacer
# cualquiera en las rutas públicas (/api/auth/login, el registro POST /api/users,
# /api/auth/logout, /actuator/health) y, tras la pista NV-A, un multipart al
# login o al registro ni siquiera cuenta en el límite por IP. Sin análisis, el
# cuerpo no se lee: el login y el registro responden 415 y el resto lo ignora.
# Si algún día se añade una subida de archivos (p. ej. portadas a MinIO/S3),
# habrá que reactivarlo con límites bajos (spring.servlet.multipart.max-file-size
# y max-request-size) y que solo se analice en esa ruta (p. ej. con
# spring.servlet.multipart.resolve-lazily=true, que lo aplaza hasta que el
# controlador pide las partes), en lugar de volver a abrirlo para toda la API.
# Ver MultipartDisabledTomcatIntegrationTest.
spring.servlet.multipart.enabled=false

# Sin FormContentFilter (misma familia que el multipart). Spring Boot lo registra
# por defecto ANTES de la seguridad para que PUT/PATCH/DELETE con un cuerpo
# application/x-www-form-urlencoded tengan sus campos como parámetros. Para
# hacerlo copia el cuerpo entero a memoria sin ningún límite (el maxPostSize de
# Tomcat solo vale para POST) y lo decodifica: cualquiera, sin token, podía
# mandar cuerpos enormes a cualquier ruta (agotamiento de memoria). La API no
# usa formularios (todo es JSON; los @RequestParam se envían en la query string),
# así que no se pierde nada. Los POST con formulario no dependen de este filtro
# (los analiza Tomcat, con su límite de 2 MB).
# Ver FormContentFilterDisabledTomcatIntegrationTest.
spring.mvc.formcontent.filter.enabled=false

# Errores que no resuelve GlobalExceptionHandler (un sendError o una excepcion
# que escapa de un filtro): Tomcat los reenvia a /error, que SecurityConfig
# permite en ese despacho interno para que el cliente vea el codigo real y no un
# 401 falso. Su cuerpo lo escribe ApiErrorController (formato ErrorResponse, sin
# el mensaje de la excepcion ni la traza); estas opciones son una defensa extra
# por si algun dia vuelve a responder el controlador de Spring Boot. Es el valor por
# defecto, pero spring-boot-devtools (perfil dev con spring-boot:run) lo cambia a
# "always"; fijarlo aqui gana a devtools y deja el mismo contrato en todos los
# perfiles. En Spring Boot 4 el prefijo es spring.web.error (server.error.* ya no
# se aplica). Ver ErrorDetailsNeverExposedPropertiesTest.
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# JWT. El secreto es OBLIGATORIO (mínimo 32 caracteres) y se lee de la variable
# de entorno JWT_SECRET. Se valida al arrancar (ver JwtProperties).
jwt.secret=${JWT_SECRET}
# Vida del JWT de acceso (cookie streambox_token): corta a propósito, porque un
# JWT no se puede revocar. Mayor que 0 y como mucho 1h (ver JwtProperties).
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}

# Refresh tokens (cookie streambox_refresh, Path=/api/auth; ver
# RefreshTokenService). Cada uno vive 7 días y rota en cada uso; la sesión
# (familia) dura como mucho 30 días desde el login. Reutilizar uno ya rotado
# revoca la sesión entera, salvo en los 10 s siguientes a la rotación (dos
# pestañas que renuevan a la vez). Variables de entorno equivalentes:
# STREAMBOX_AUTH_REFRESH_TTL, STREAMBOX_AUTH_REFRESH_FAMILY_TTL...
streambox.auth.refresh.ttl=7d
streambox.auth.refresh.family-ttl=30d
streambox.auth.refresh.reuse-grace=10s
# Limpieza periódica de la tabla refresh_tokens: borra las sesiones caducadas y
# los tokens caducados hace más de "retention" (se conservan un tiempo porque
# son los que delatan que alguien reutiliza un token copiado).
streambox.auth.refresh.cleanup.enabled=true
streambox.auth.refresh.cleanup.interval=1h
streambox.auth.refresh.cleanup.initial-delay=1m
streambox.auth.refresh.cleanup.retention=3d

# Primer administrador (opcional). Si ADMIN_EMAIL y ADMIN_PASSWORD están
# definidos, se crea al arrancar siempre que no exista ya. Al crearlo, la
# contraseña debe cumplir la misma política que el registro (12 a 64
# caracteres, máximo 72 bytes, no común y sin el usuario ni el email); si no,
# la aplicación no arranca. Si el administrador ya existe, la contraseña no se
# usa ni se valida (solo se avisa en el log si no cumple la política).
# Ver AdminAccountInitializer y PasswordPolicy.
streambox.admin.email=${ADMIN_EMAIL:}
streambox.admin.username=${ADMIN_USERNAME:admin}
streambox.admin.password=${ADMIN_PASSWORD:}

# Límites contra fuerza bruta y abuso (ver RateLimitingFilter y LoginAttemptService).
# Por IP: intentos de login y registros permitidos dentro de la ventana.
streambox.security.rate-limit.login.max-requests=10
streambox.security.rate-limit.login.window=1m
streambox.security.rate-limit.register.max-requests=5
streambox.security.rate-limit.register.window=1h
# Renovaciones de sesión (POST /api/auth/refresh) por IP. El frontend renueva
# una vez cada 15 minutos por navegador: 30 por minuto sobra incluso con mucha
# gente detrás de la misma IP. Solo cuentan las que traen X-Requested-With y la
# cookie streambox_refresh: el refresh sin cookie de cada visita anónima no
# gasta nada (ver RateLimitingFilter).
streambox.security.rate-limit.refresh.max-requests=30
streambox.security.rate-limit.refresh.window=1m
# Por cuenta: tras N logins fallidos se bloquea el email hasta que caduquen.
# Los fallos anteriores responden 401 con remainingAttempts; el N-ésimo ya
# responde 429 ACCOUNT_LOCKED (ver LoginAttemptService).
streambox.security.rate-limit.lockout.max-failures=5
streambox.security.rate-limit.lockout.window=15m
# IPs conocidas: una IP desde la que el titular ha iniciado sesion CON EXITO no
# queda sujeta al bloqueo de la cuenta (usa su propio contador, con los mismos
# limites), para que un anonimo no pueda dejar fuera al titular renovando el
# bloqueo cada 15 minutos. Se recuerdan como mucho N IPs por cuenta (al pasarse
# se olvida la mas antigua) y cada una caduca tras su ultimo login correcto.
# Estado en memoria: se pierde al reiniciar.
streambox.security.rate-limit.lockout.max-known-ips=5
streambox.security.rate-limit.lockout.known-ip-ttl=30d
# Tope de claves vivas (IPs o emails) en CADA contador en memoria. Al llenarse se
# purgan las caducadas y, si sigue lleno, se expulsa la clave con la actividad
# mas antigua (se prefiere olvidar claves viejas a rechazar las nuevas, que
# dejaria sin login ni registro a todos). Las IPv6 se agrupan por /64.
# Orden de magnitud: unos 300 B por clave de IP y unos 600 B por clave de email.
streambox.security.rate-limit.max-keys=100000

# Actuator: solo se exponen "health" e "info". /actuator/health es público
# (ver SecurityConfig) pero nunca muestra detalles: únicamente UP o DOWN, para
# no revelar qué base de datos o servicios usa la aplicación.
# Con probes activadas existen /actuator/health/liveness (el proceso vive) y
# /actuator/health/readiness (listo para recibir tráfico), pensadas para Docker
# y Kubernetes. El estado de la base de datos forma parte de la comprobación.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
