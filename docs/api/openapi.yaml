components:
  schemas:
    EpisodeRequest:
      type: object
      properties:
        seasonNumber:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
        episodeNumber:
          type: integer
          format: int32
          maximum: 1000
          minimum: 1
        title:
          type: string
          maxLength: 150
          minLength: 0
        description:
          type: string
          description: Sinopsis opcional. Si se omite o va en blanco se guarda sin sinopsis (null en la respuesta).
          maxLength: 1000
          minLength: 0
        duration:
          type: integer
          format: int32
          maximum: 600
          minimum: 1
        videoUrl:
          type: string
          description: URL del vídeo. Debe ser una URL https:// absoluta, con host y sin credenciales (usuario:clave@). Solo
            caracteres ASCII visibles (sin espacios); máximo 500 caracteres.
          example: https://videos.streambox.example/watch/serie-1x01
          maxLength: 500
          minLength: 0
      required:
      - duration
      - episodeNumber
      - seasonNumber
      - title
      - videoUrl
    EpisodeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        seasonNumber:
          type: integer
          format: int32
        episodeNumber:
          type: integer
          format: int32
        title:
          type: string
        description:
          type: string
        duration:
          type: integer
          format: int32
        videoUrl:
          type: string
    SeriesRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 150
          minLength: 0
        description:
          type: string
          maxLength: 1000
          minLength: 0
        releaseYear:
          type: integer
          format: int32
          maximum: 2100
          minimum: 1888
        endYear:
          type: integer
          format: int32
          description: Año en que terminó la serie; null o ausente si sigue en emisión. Si se indica, entre 1888 y 2100 y
            no anterior a releaseYear.
          maximum: 2100
          minimum: 1888
        imageUrl:
          type: string
          description: URL de la portada. Debe ser una URL https:// absoluta, con host y sin credenciales (usuario:clave@),
            o una portada propia del frontend con la forma /covers/<archivo>, donde el archivo empieza por letra o número
            y solo contiene letras, números, punto, guion y guion bajo. Solo caracteres ASCII visibles (sin espacios); máximo
            500 caracteres.
          example: https://image.tmdb.org/t/p/w500/portada.jpg
          maxLength: 500
          minLength: 0
        genreIds:
          type: array
          items:
            type: integer
            format: int64
          maxItems: 20
          minItems: 0
          uniqueItems: true
      required:
      - description
      - genreIds
      - imageUrl
      - releaseYear
      - title
    GenreResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    SeasonResponse:
      type: object
      properties:
        seasonNumber:
          type: integer
          format: int32
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeResponse'
    SeriesDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        releaseYear:
          type: integer
          format: int32
        endYear:
          type: integer
          format: int32
        imageUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreResponse'
        seasonCount:
          type: integer
          format: int64
        episodeCount:
          type: integer
          format: int64
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/SeasonResponse'
    MovieRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 150
          minLength: 0
        description:
          type: string
          maxLength: 1000
          minLength: 0
        duration:
          type: integer
          format: int32
          minimum: 1
        releaseYear:
          type: integer
          format: int32
          maximum: 2100
          minimum: 1888
        imageUrl:
          type: string
          description: URL de la portada. Debe ser una URL https:// absoluta, con host y sin credenciales (usuario:clave@),
            o una portada propia del frontend con la forma /covers/<archivo>, donde el archivo empieza por letra o número
            y solo contiene letras, números, punto, guion y guion bajo. Solo caracteres ASCII visibles (sin espacios); máximo
            500 caracteres.
          example: https://image.tmdb.org/t/p/w500/portada.jpg
          maxLength: 500
          minLength: 0
        videoUrl:
          type: string
          description: URL del vídeo. Debe ser una URL https:// absoluta, con host y sin credenciales (usuario:clave@). Solo
            caracteres ASCII visibles (sin espacios); máximo 500 caracteres.
          example: https://videos.streambox.example/watch/dune
          maxLength: 500
          minLength: 0
        genreIds:
          type: array
          items:
            type: integer
            format: int64
          maxItems: 20
          minItems: 0
          uniqueItems: true
      required:
      - description
      - duration
      - genreIds
      - imageUrl
      - releaseYear
      - title
      - videoUrl
    MovieResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        duration:
          type: integer
          format: int32
        releaseYear:
          type: integer
          format: int32
        imageUrl:
          type: string
        videoUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreResponse'
          uniqueItems: true
    GenreRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 2
      required:
      - name
    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
          minLength: 3
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          description: 'Contraseña de la cuenta: entre 12 y 64 caracteres y como máximo 72 bytes en UTF-8 (las tildes y eñes
            ocupan 2 bytes y los emojis 4). No puede ser una contraseña común o trivial ni contener el nombre de usuario o
            la parte del email anterior a la @. No se exigen mayúsculas, números ni símbolos: se recomienda una frase larga.'
          example: un paseo por el retiro en otoño
          maxLength: 64
          minLength: 12
      required:
      - email
      - password
      - username
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - USER
          - ADMIN
        createdAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 1024
          minLength: 0
      required:
      - email
      - password
    SeriesResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        releaseYear:
          type: integer
          format: int32
        endYear:
          type: integer
          format: int32
        imageUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreResponse'
        seasonCount:
          type: integer
          format: int64
        episodeCount:
          type: integer
          format: int64
    SeriesPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SeriesResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    MoviePageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MovieResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    ErrorResponse:
      type: object
      description: 'Formato común de todas las respuestas de error de la API (4xx y 5xx). El cliente debe decidir por status
        y code, nunca por el texto de message. Los campos que no aplican a un error se omiten del JSON: nunca se envían con
        valor null.'
      properties:
        timestamp:
          type: string
          format: date-time
          description: Fecha y hora del error, en UTC y formato ISO-8601.
          example: '2026-10-04T11:15:30.123Z'
        status:
          type: integer
          format: int32
          description: Código de estado HTTP; coincide con el de la respuesta.
          example: 404
        error:
          type: string
          description: Frase estándar del estado HTTP según la especificación (en inglés).
          example: Not Found
        code:
          type: string
          description: 'Código funcional estable del error: el cliente debe decidir por este campo (y por status), nunca por
            el texto de message. Valores:

            - RESOURCE_NOT_FOUND (404): el recurso o la ruta no existen (una serie sin episodios también da este código a
            los usuarios).

            - MOVIE_NOT_IN_FAVORITES (404): la película no está en la lista del usuario.

            - SERIES_NOT_IN_FAVORITES (404): la serie existe, pero no está en la lista del usuario.

            - CSRF_REJECTED (403): petición no segura (POST/PUT/PATCH/DELETE) autenticada por cookie sin la cabecera X-Requested-With:
            StreamBox. POST /api/auth/refresh y POST /api/auth/logout la exigen siempre, también con Authorization: Bearer.

            - USER_ALREADY_EXISTS (409): el nombre de usuario o el email ya están registrados.

            - MOVIE_ALREADY_IN_FAVORITES (409): la película ya está en la lista del usuario.

            - SERIES_ALREADY_IN_FAVORITES (409): la serie ya está en la lista del usuario.

            - EPISODE_ALREADY_EXISTS (409): la serie ya tiene un episodio con esa temporada y número.

            - GENRE_ALREADY_EXISTS (409): ya existe otro género con ese nombre.

            - GENRE_IN_USE (409): el género no se puede borrar porque alguna película o serie lo tiene asignado.

            - AMBIGUOUS_TITLE (409): varias películas tienen ese título; hay que usar el id.

            - DATA_INTEGRITY_VIOLATION (409): la operación choca con una restricción de los datos.

            - VALIDATION_ERROR (400): datos o parámetros no válidos; el detalle por campo va en validationErrors.

            - MALFORMED_REQUEST (400 y otros 4xx genéricos): la petición no se puede interpretar (JSON mal formado, tipos
            incorrectos).

            - INVALID_CREDENTIALS (401): email o contraseña incorrectos en el login, o token ausente, caducado o no válido.

            - SESSION_EXPIRED (401): POST /api/auth/refresh no puede renovar la sesión (refresh token ausente, caducado, revocado
            o reutilizado); hay que volver a iniciar sesión.

            - ACCESS_DENIED (403): autenticado, pero sin permisos (por ejemplo, no es ADMIN).

            - METHOD_NOT_ALLOWED (405): el método HTTP no está soportado por la ruta.

            - UNSUPPORTED_MEDIA_TYPE (415): el tipo de contenido no está soportado.

            - NOT_ACCEPTABLE (406): la cabecera Accept pide un formato que la API no produce; la API solo responde en JSON
            (este error también va en JSON).

            - RATE_LIMIT_EXCEEDED (429): demasiadas peticiones de login, registro o renovación de sesión (POST /api/auth/refresh)
            desde la misma IP; ver la cabecera Retry-After.

            - ACCOUNT_LOCKED (429): la cuenta está bloqueada temporalmente por logins fallidos; ver la cabecera Retry-After.

            - INTERNAL_ERROR (500 u otro 5xx): error no controlado en el servidor.'
          enum:
          - RESOURCE_NOT_FOUND
          - USER_ALREADY_EXISTS
          - MOVIE_ALREADY_IN_FAVORITES
          - MOVIE_NOT_IN_FAVORITES
          - VALIDATION_ERROR
          - INVALID_CREDENTIALS
          - DATA_INTEGRITY_VIOLATION
          - INTERNAL_ERROR
          - AMBIGUOUS_TITLE
          - ACCESS_DENIED
          - MALFORMED_REQUEST
          - METHOD_NOT_ALLOWED
          - UNSUPPORTED_MEDIA_TYPE
          - NOT_ACCEPTABLE
          - RATE_LIMIT_EXCEEDED
          - ACCOUNT_LOCKED
          - GENRE_ALREADY_EXISTS
          - GENRE_IN_USE
          - EPISODE_ALREADY_EXISTS
          - SERIES_ALREADY_IN_FAVORITES
          - SERIES_NOT_IN_FAVORITES
          - CSRF_REJECTED
          - SESSION_EXPIRED
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          description: 'Mensaje legible en español, pensado para mostrarlo al usuario. Puede cambiar: no se debe usar para
            tomar decisiones.'
          example: Película no encontrada
        path:
          type: string
          description: Ruta de la petición que produjo el error (sin los parámetros de consulta).
          example: /api/movies/42
        validationErrors:
          type: object
          additionalProperties:
            type: string
          description: 'Solo en los 400 con código VALIDATION_ERROR: un mensaje por cada campo o parámetro no válido (nombre
            del campo → mensaje). En el resto de errores no aparece (no se envía con null).'
          example:
            title: El título es obligatorio
        remainingAttempts:
          type: integer
          format: int32
          description: 'Solo en el 401 INVALID_CREDENTIALS del login: intentos que le quedan a la cuenta, con este fallo ya
            descontado. Nunca vale 0, porque el fallo que agota los intentos ya responde 429 ACCOUNT_LOCKED. En el resto de
            errores no aparece (no se envía con null).'
          example: 4
          minimum: 1
      required:
      - code
      - error
      - message
      - path
      - status
      - timestamp
  securitySchemes:
    cookieAuth:
      type: apiKey
      description: 'Autenticación principal (navegador): el JWT de acceso viaja en la cookie HttpOnly streambox_token que
        fija POST /api/auth/login (Path=/api, 15 minutos; se renueva con POST /api/auth/refresh). Las peticiones no seguras
        (POST, PUT, PATCH, DELETE) autenticadas por esta cookie deben llevar además la cabecera X-Requested-With: StreamBox
        (defensa CSRF); si falta, 403 CSRF_REJECTED. Si la petición trae Authorization: Bearer, manda el Bearer y la cookie
        no se mira. Swagger UI no puede fijar esta cookie: para probar desde aquí usa bearerAuth.'
      name: streambox_token
      in: cookie
    bearerAuth:
      type: http
      description: 'Alternativa para clientes de API sin navegador: el mismo JWT de acceso (el valor de la cookie streambox_token)
        en la cabecera Authorization: Bearer. Con Bearer no se exige X-Requested-With (no hay riesgo de CSRF).'
      scheme: bearer
      bearerFormat: JWT
