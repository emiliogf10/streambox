  /api/auth/refresh:
    post:
      tags:
      - auth-controller
      summary: Renueva la sesión
      description: 'Entrega un JWT de acceso nuevo (cookie streambox_token) a partir del refresh token de la cookie streambox_refresh,
        sin pedir la contraseña. Sin cuerpo. Solo lee la cookie streambox_refresh: ignora streambox_token y la cabecera Authorization.
        Exige la cabecera X-Requested-With: StreamBox (defensa CSRF). Cada uso rota el refresh token: el viejo queda revocado
        y llega uno nuevo en Set-Cookie (vida de 7 días, sin pasar de 30 días desde el login). Reutilizar un refresh token
        ya rotado se trata como un robo y revoca la sesión entera (también el token nuevo), salvo en los 10 segundos siguientes
        a la rotación: así dos pestañas que renuevan a la vez no se cierran la sesión; la segunda recibe solo el JWT nuevo,
        sin Set-Cookie de streambox_refresh, porque el navegador ya tiene el sucesor.'
      operationId: refresh
      parameters:
      - name: streambox_refresh
        in: cookie
        description: Refresh token (cookie HttpOnly streambox_refresh que fija el login; el navegador la envía solo)
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Sesión renovada; sin cuerpo. Set-Cookie con streambox_token y, salvo en la gracia de un refresh simultáneo,
            con el streambox_refresh nuevo
        '401':
          description: 'Código SESSION_EXPIRED: el refresh token falta, no existe, ha caducado (él o su sesión de 30 días),
            está revocado (logout) o se ha reutilizado (y entonces se revoca toda la sesión). Mismo cuerpo en todos los casos.
            La respuesta borra las dos cookies: hay que volver a iniciar sesión'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Código CSRF_REJECTED: falta la cabecera X-Requested-With: StreamBox. No se mira el refresh token ni
            se gasta el límite por IP'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Código RATE_LIMIT_EXCEEDED: demasiadas renovaciones desde esta IP (30 por minuto por defecto); la
            cabecera Retry-After indica los segundos que hay que esperar. Solo cuentan las peticiones con la cabecera X-Requested-With
            y con la cookie streambox_refresh: sin cookie (visita sin sesión) la respuesta es siempre el 401 SESSION_EXPIRED'
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de volver a intentarlo (entero, mínimo 1).
              required: true
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      tags:
      - auth-controller
      summary: Cierra sesión
      description: 'Revoca en el servidor la sesión del refresh token de la cookie streambox_refresh (sus tokens dejan de
        servir para renovar) y borra las cookies streambox_token y streambox_refresh (Set-Cookie con Max-Age=0). Es público
        e idempotente: responde 204 haya o no sesión, y con un refresh token desconocido o ya revocado. Exige la cabecera
        X-Requested-With: StreamBox (defensa CSRF, también con Authorization: Bearer): sin ella otra web podría borrar las
        cookies de la víctima. El JWT de acceso es stateless y no se puede revocar: una copia seguiría valiendo hasta su caducidad
        (como mucho 15 minutos por defecto), pero ya no se podría renovar.'
      operationId: logout
      parameters:
      - name: streambox_refresh
        in: cookie
        description: Refresh token de la sesión que se cierra (cookie HttpOnly streambox_refresh); opcional
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Sesión revocada (si la había) y cookies borradas
        '403':
          description: 'Código CSRF_REJECTED: falta la cabecera X-Requested-With: StreamBox. No se revoca nada ni se borran
            las cookies: la sesión sigue abierta'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Código INTERNAL_ERROR: no se ha podido revocar la sesión (por ejemplo, la base de datos no responde).
            No se borran las cookies: la sesión sigue viva en el servidor y el cliente debe reintentar el logout en lugar
            de darla por cerrada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      tags:
      - auth-controller
      summary: Inicia sesión
      description: 'Autentica un usuario mediante su correo electrónico y contraseña. Los tokens no van en el cuerpo: se entregan
        en dos cookies HttpOnly; SameSite=Strict (Secure según la configuración). streambox_token: JWT de acceso, Path=/api,
        Max-Age = su vida (15 minutos por defecto). streambox_refresh: refresh token opaco, Path=/api/auth (solo viaja a login,
        refresh y logout), Max-Age = su vida (7 días). Cuando el JWT caduca, POST /api/auth/refresh entrega uno nuevo sin
        volver a pedir la contraseña. Las peticiones POST/PUT/PATCH/DELETE autenticadas por cookie deben llevar la cabecera
        X-Requested-With: StreamBox (403 CSRF_REJECTED si falta). También se acepta Authorization: Bearer con el JWT de acceso
        (clientes de API), sin esa cabecera extra.'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '204':
          description: Autenticación correcta; sin cuerpo, con las cookies streambox_token y streambox_refresh en Set-Cookie
        '400':
          description: 'Los datos proporcionados no son válidos (email con formato incorrecto, contraseña vacía o de más de
            1024 caracteres). No gasta intento de la cuenta. En el login no se aplica la política de longitud del registro:
            las cuentas antiguas siguen pudiendo entrar'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Credenciales incorrectas (código INVALID_CREDENTIALS, mensaje «Email o contraseña incorrectos»). El
            cuerpo incluye remainingAttempts: intentos que le quedan a la cuenta ya descontado este fallo (siempre 1 o más);
            si el siguiente intento también falla y era el último, la cuenta se bloquea y se responde 429 ACCOUNT_LOCKED.
            Desde una misma IP de origen es idéntico exista o no el email'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Demasiados intentos; la cabecera Retry-After indica los segundos que hay que esperar. Código ACCOUNT_LOCKED:
            la cuenta está bloqueada por logins fallidos (lo devuelve el fallo que agota los intentos y cualquier intento
            durante el bloqueo, aunque la contraseña sea correcta; el mensaje dice cuántos minutos dura; no se aplica a una
            IP desde la que el titular ya inició sesión con éxito, que tiene su propio contador con los mismos límites). Código
            RATE_LIMIT_EXCEEDED: demasiadas peticiones de login desde esta IP'
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de volver a intentarlo (entero, mínimo 1).
              required: true
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
