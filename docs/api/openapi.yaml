# Especificación OpenAPI 3.1 de la API de StreamBox.
# Generada con springdoc (GET /v3/api-docs) desde el backend real y convertida a YAML;
# solo se ha cambiado `servers`. Para regenerarla: ver docs/api/README.md.
# Autenticación: cookies HttpOnly (streambox_token + streambox_refresh) o Authorization: Bearer; ver README.
openapi: 3.1.0
info:
  title: Streambox API
  description: API REST para la gestión de películas, géneros y usuarios de Streambox.
  version: '1.0'
servers:
- url: http://localhost:8080
  description: Backend local (perfil dev)
paths:
  /api/series/{seriesId}/episodes/{episodeId}:
    put:
      tags:
      - episode-controller
      summary: Modifica un episodio
      description: Actualiza los datos de un episodio de la serie, incluida su temporada y número. Requiere rol ADMIN.
      operationId: updateEpisode
      parameters:
      - name: seriesId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: episodeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpisodeRequest'
        required: true
      responses:
        '200':
          description: Episodio modificado correctamente
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EpisodeResponse'
        '400':
          description: Los datos proporcionados no son válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'El usuario no tiene permisos de administrador. También 403 con código CSRF_REJECTED si la petición
            se autentica por la cookie streambox_token y le falta la cabecera X-Requested-With: StreamBox (defensa CSRF; con
            Authorization: Bearer no se exige)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La serie no existe, o el episodio no existe o es de otra serie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Otro episodio ya ocupa esa temporada y número (código EPISODE_ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
    delete:
      tags:
      - episode-controller
      summary: Elimina un episodio
      description: Elimina un episodio de la serie. Si era el último, la serie vuelve a quedar oculta para los usuarios. Requiere
        rol ADMIN.
      operationId: deleteEpisode
      parameters:
      - name: seriesId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: episodeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Episodio eliminado correctamente
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'El usuario no tiene permisos de administrador. También 403 con código CSRF_REJECTED si la petición
            se autentica por la cookie streambox_token y le falta la cabecera X-Requested-With: StreamBox (defensa CSRF; con
            Authorization: Bearer no se exige)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La serie no existe, o el episodio no existe o es de otra serie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/series/{id}:
    get:
      tags:
      - series-controller
      summary: Obtiene una serie por ID
      description: Devuelve la serie con sus géneros y sus temporadas (cada una con sus episodios, ordenados por número).
        Una serie sin episodios responde 404, igual que una inexistente.
      operationId: getSeriesById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Serie encontrada
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SeriesDetailResponse'
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La serie no existe o no tiene episodios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
    put:
      tags:
      - series-controller
      summary: Modifica una serie
      description: Actualiza los datos de una serie y sus géneros. Los episodios no se tocan. Requiere rol ADMIN.
      operationId: updateSeries
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesRequest'
        required: true
      responses:
        '200':
          description: Serie modificada correctamente
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SeriesDetailResponse'
        '400':
          description: Los datos proporcionados no son válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'El usuario no tiene permisos de administrador. También 403 con código CSRF_REJECTED si la petición
            se autentica por la cookie streambox_token y le falta la cabecera X-Requested-With: StreamBox (defensa CSRF; con
            Authorization: Bearer no se exige)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Serie o género no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
    delete:
      tags:
      - series-controller
      summary: Elimina una serie
      description: Elimina la serie, todos sus episodios y la retira de las listas de todos los usuarios. Requiere rol ADMIN.
      operationId: deleteSeries
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Serie eliminada correctamente
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'El usuario no tiene permisos de administrador. También 403 con código CSRF_REJECTED si la petición
            se autentica por la cookie streambox_token y le falta la cabecera X-Requested-With: StreamBox (defensa CSRF; con
            Authorization: Bearer no se exige)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Serie no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/movies/{id}:
    get:
      tags:
      - movie-controller
      summary: Obtiene una película por ID
      description: Devuelve la información completa de una película incluyendo los géneros asociados.
      operationId: getMovieById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Película encontrada
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Película no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
    put:
      tags:
      - movie-controller
      summary: Modifica una película
      description: Actualiza los datos de una película existente y sus géneros asociados. Requiere rol ADMIN.
      operationId: updateMovie
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieRequest'
        required: true
      responses:
        '200':
          description: Película modificada correctamente
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '400':
          description: Los datos proporcionados no son válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'El usuario no tiene permisos de administrador. También 403 con código CSRF_REJECTED si la petición
            se autentica por la cookie streambox_token y le falta la cabecera X-Requested-With: StreamBox (defensa CSRF; con
            Authorization: Bearer no se exige)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Película o género no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
    delete:
      tags:
      - movie-controller
      summary: Elimina una película
      description: Elimina de Streambox la película correspondiente al ID indicado. La película se retira automáticamente
        de todos los favoritos. Requiere rol ADMIN.
      operationId: deleteMovie
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Película eliminada correctamente
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'El usuario no tiene permisos de administrador. También 403 con código CSRF_REJECTED si la petición
            se autentica por la cookie streambox_token y le falta la cabecera X-Requested-With: StreamBox (defensa CSRF; con
            Authorization: Bearer no se exige)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Película no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/genres/{id}:
    put:
      tags:
      - genre-controller
      summary: Renombra un género
      description: Cambia el nombre de un género existente. El nombre se normaliza igual que en el alta (sin espacios exteriores,
        primera letra en mayúscula y el resto en minúscula). Renombrarlo a su mismo nombre no es un error. Requiere rol ADMIN.
      operationId: updateGenre
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreRequest'
        required: true
      responses:
        '200':
          description: Género modificado correctamente
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GenreResponse'
        '400':
          description: Los datos proporcionados no son válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'El usuario no tiene permisos de administrador. También 403 con código CSRF_REJECTED si la petición
            se autentica por la cookie streambox_token y le falta la cabecera X-Requested-With: StreamBox (defensa CSRF; con
            Authorization: Bearer no se exige)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Género no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Otro género ya tiene ese nombre (código GENRE_ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
    delete:
      tags:
      - genre-controller
      summary: Elimina un género
      description: Elimina el género indicado. Solo se puede borrar si ninguna película ni serie lo tiene asignado; si no,
        hay que quitarlo antes de esas películas y series. Requiere rol ADMIN.
      operationId: deleteGenre
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Género eliminado correctamente
        '400':
          description: El identificador no tiene un formato válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'El usuario no tiene permisos de administrador. También 403 con código CSRF_REJECTED si la petición
            se autentica por la cookie streambox_token y le falta la cabecera X-Requested-With: StreamBox (defensa CSRF; con
            Authorization: Bearer no se exige)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Género no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Alguna película o serie tiene asignado el género; el mensaje indica cuántas de cada (código GENRE_IN_USE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/users:
    get:
      tags:
      - user-controller
      summary: Obtiene todos los usuarios
      description: Devuelve la lista de usuarios registrados. Este endpoint requiere permisos de administrador.
      operationId: getUsers
      responses:
        '200':
          description: Usuarios obtenidos correctamente
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene permisos de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
    post:
      tags:
      - user-controller
      summary: Registra un nuevo usuario
      description: Crea una nueva cuenta de usuario en Streambox. No requiere autenticación.
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: 'Los datos proporcionados no son válidos (código VALIDATION_ERROR, un mensaje por campo en validationErrors).
            La contraseña debe tener entre 12 y 64 caracteres, ocupar como máximo 72 bytes en UTF-8, no ser común ni trivial
            y no contener el nombre de usuario ni la parte local del email. Si incumple varias reglas solo se informa de una,
            por este orden: longitud, bytes, común, datos personales'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El nombre de usuario o el correo ya están en uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiados registros desde esta IP; ver cabecera Retry-After
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de volver a intentarlo (entero, mínimo 1).
              required: true
              schema:
                type: integer
                format: int32
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/me/favorites/{movieId}:
    post:
      tags:
      - favorite-controller
      summary: Añade una película a mi lista
      description: Añade una película a los favoritos del usuario autenticado.
      operationId: addFavorite
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Película añadida correctamente
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Código CSRF_REJECTED: la petición se autentica por la cookie streambox_token y le falta la cabecera
            X-Requested-With: StreamBox (defensa CSRF). Con Authorization: Bearer no se exige'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Película no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La película ya está incluida en mi lista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
    delete:
      tags:
      - favorite-controller
      summary: Elimina una película de mi lista
      description: Elimina una película de los favoritos del usuario autenticado.
      operationId: removeFavorite
      parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Película eliminada correctamente
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Código CSRF_REJECTED: la petición se autentica por la cookie streambox_token y le falta la cabecera
            X-Requested-With: StreamBox (defensa CSRF). Con Authorization: Bearer no se exige'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La película no existe o no está en mi lista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/users/me/favorites/series/{seriesId}:
    post:
      tags:
      - series-favorite-controller
      summary: Añade una serie a mi lista
      description: Añade una serie con episodios a los favoritos del usuario autenticado.
      operationId: addFavorite_1
      parameters:
      - name: seriesId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Serie añadida correctamente
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Código CSRF_REJECTED: la petición se autentica por la cookie streambox_token y le falta la cabecera
            X-Requested-With: StreamBox (defensa CSRF). Con Authorization: Bearer no se exige'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La serie no existe o no tiene episodios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La serie ya está en mi lista (código SERIES_ALREADY_IN_FAVORITES)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
    delete:
      tags:
      - series-favorite-controller
      summary: Quita una serie de mi lista
      description: Elimina una serie de los favoritos del usuario autenticado. Una serie que estaba en la lista se puede quitar
        aunque se haya quedado sin episodios.
      operationId: removeFavorite_1
      parameters:
      - name: seriesId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Serie quitada correctamente
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Código CSRF_REJECTED: la petición se autentica por la cookie streambox_token y le falta la cabecera
            X-Requested-With: StreamBox (defensa CSRF). Con Authorization: Bearer no se exige'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'La serie no estaba en mi lista: SERIES_NOT_IN_FAVORITES si es una serie con episodios; RESOURCE_NOT_FOUND
            ("Serie no encontrada") si no existe o no tiene episodios, sin distinguir entre ambos casos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
  /api/users/me/favorites/by-title:
    post:
      tags:
      - favorite-controller
      summary: Añade una película a mi lista por título
      description: Añade a favoritos una película cuyo título coincide exactamente con el parámetro title, sin distinguir
        mayúsculas.
      operationId: addFavoriteByTitle
      parameters:
      - name: title
        in: query
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Película añadida correctamente
        '401':
          description: El usuario no está autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Código CSRF_REJECTED: la petición se autentica por la cookie streambox_token y le falta la cabecera
            X-Requested-With: StreamBox (defensa CSRF). Con Authorization: Bearer no se exige'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe una película con el título indicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La película ya está en mi lista, o el título es ambiguo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
      - bearerAuth: []
    delete:
      tags:
      - favorite-controller
      summary: Elimina una película de mi lista por título
