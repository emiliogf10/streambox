# ===================================================================
# nginx del frontend de StreamBox (se copia a /etc/nginx/conf.d/default.conf)
#
# Hace dos cosas desde un ÚNICO origen (mismo esquema, host y puerto):
#   1. Sirve la SPA compilada (dist/ de Vite).
#   2. Hace de proxy de /api/ al backend (servicio "backend" de compose).
# Al ser el mismo origen, el navegador no aplica CORS: es lo mismo que hace
# el proxy de Vite en desarrollo (vite.config.ts), así que el código del
# frontend (fetch a "/api/...") no cambia entre desarrollo y Docker.
#
# Este archivo se incluye DENTRO del bloque http {} del nginx.conf de la
# imagen (que ya define los logs a stdout, el pid y los temporales en /tmp).
# ===================================================================

# No anunciar la versión de nginx en la cabecera "Server" ni en las páginas
# de error: no aporta nada al usuario y facilita buscar fallos conocidos.
server_tokens off;

# ---------- Compresión -------------------------------------------------
# El JS y el CSS de Vite comprimen ~70 %. gzip_vary añade "Vary:
# Accept-Encoding" para que una caché intermedia no sirva la versión
# comprimida a un cliente que no la entiende. Por debajo de 1 KB no
# compensa. text/html se comprime siempre (no hace falta listarlo).
# Las imágenes (webp/jpg) ya van comprimidas: gzip solo gastaría CPU.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# ---------- Backend ----------------------------------------------------
# "backend" es el nombre del servicio en docker-compose.yml; lo resuelve el
# DNS interno de Docker (127.0.0.11). Con "resolve", nginx vuelve a
# preguntar la IP cada 10 s: si el contenedor del backend se reinicia o se
# recrea (docker compose up --build) y cambia de IP, nginx la sigue sin
# reiniciarse. Con un proxy_pass normal la resolvería UNA vez al arrancar y
# daría 502 tras el primer cambio. "zone" es obligatoria con "resolve".
upstream streambox_backend {
    zone streambox_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
    # Conexiones reutilizadas con el backend (evita abrir una TCP por
    # petición). Exige HTTP/1.1 y vaciar "Connection" en el location.
    keepalive 16;
}

# ---------- Caché del navegador ----------------------------------------
# Un único add_header con el valor que toque según la ruta. Se hace con un
# map (y no con add_header dentro de cada location) por una trampa de nginx:
# si un location tiene CUALQUIER add_header propio, deja de heredar TODOS
# los del server. Así, las cabeceras de seguridad de la fase 3 se podrán
# poner una sola vez en el server y llegarán a todas las respuestas.
# Un valor vacío ("") hace que nginx no envíe la cabecera.
map $uri $streambox_cache_control {
    # Recursos de Vite con hash en el nombre (index-3f9a1c.js): si el
    # contenido cambia, cambia el nombre. Se pueden guardar un año sin
    # volver a preguntar ("immutable").
    ~^/assets/      "public, max-age=31536000, immutable";
    # index.html NO lleva hash y es el que apunta a los recursos nuevos:
    # "no-cache" obliga al navegador a revalidarlo (ETag) en cada visita,
    # para que tras un despliegue nadie se quede con la versión anterior.
    # Cubre también las rutas de la SPA (/series/7...), que acaban aquí.
    /index.html     "no-cache";
    # Portadas: sin hash, pero cambian muy poco. Un día de caché y después
    # se revalidan (304 si no han cambiado).
    ~^/covers/      "public, max-age=86400";
    # Resto (favicon, /api/...): sin cabecera añadida. Las respuestas de la
    # API ya traen las suyas de Spring Security (no-cache, no-store).
    default         "";
}

server {
    # Puerto sin privilegios: la imagen nginx-unprivileged no se ejecuta
    # como root y no puede abrir puertos < 1024. Lo publica docker compose.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las redirecciones que genere nginx serán relativas ("Location: /x/")
    # en vez de absolutas con el puerto INTERNO (http://host:8080/x/), que
    # desde fuera no existe (en el host se publica otro puerto).
    absolute_redirect off;

    add_header Cache-Control $streambox_cache_control;

    # ===============================================================
    # Cabeceras de seguridad
    #
    # Van AQUÍ, a nivel de server, y NUNCA dentro de un location: un
    # location con cualquier add_header propio deja de heredar TODAS las de
    # aquí (y una ruta se quedaría sin CSP sin que nadie lo notara).
    # "always" = también en los errores (401, 403, 404, 429, 502...), que
    # por defecto nginx deja sin cabeceras añadidas. Llegan a todo: la SPA,
    # /assets/, /covers/, /healthz y las respuestas de la API que pasan por
    # el proxy (de estas se quitan las que ya pone Spring Security, para no
    # enviarlas duplicadas: ver proxy_hide_header en location /api/).
    # ===============================================================

    # --- Content-Security-Policy (CSP) ---
    # Lista blanca de lo que el navegador puede cargar y ejecutar en esta
    # página. Es la segunda línea de defensa contra XSS: si alguien lograra
    # meter un <script> o un onclick="..." en el HTML, el navegador se
    # negaría a ejecutarlo. Complementa a la cookie HttpOnly de la sesión
    # (tarea 29): el JWT ya no es legible por JavaScript, pero un script
    # inyectado aún podría hacer peticiones en nombre del usuario.
    #   default-src 'self'   lo no listado abajo (fuentes, media, workers,
    #                        manifest...) solo desde este mismo origen.
    #   script-src 'self'    solo /assets/*.js. Sin 'unsafe-inline' ni
    #                        'unsafe-eval': nada de <script> en línea, onclick
    #                        ni eval(). El index.html de Vite (build) no tiene
    #                        ningún script en línea (en dev sí: por eso esta
    #                        CSP NO se aplica a "npm run dev").
    #   style-src 'self'     solo /assets/*.css. Sin 'unsafe-inline': bloquea
    #                        style="..." y <style>. El proyecto tiene la regla
    #                        "cero style={{}}"; lo único que toca estilos desde
    #                        JS es useHeightCssVariable (style.setProperty, es
    #                        decir, CSSOM), que la CSP no bloquea.
    #   img-src 'self' https:  portadas propias (/covers/) y las que el admin
    #                        enlaza por https:// (el backend solo admite https
    #                        o /covers/). Sin http: (contenido mixto) y sin
    #                        data: (no se usa en ningún sitio: ni el CSS ni
    #                        el JS compilados contienen "data:").
    #   connect-src 'self'   fetch solo a /api/ del mismo origen: un script
    #                        malicioso no podría enviar datos a otro
    #                        servidor con fetch.
    #   object-src 'none'    sin <object>/<embed> (Flash, PDF incrustados...).
    #   base-uri 'self'      un <base href> inyectado no puede desviar las
    #                        rutas relativas a otro servidor.
    #   form-action 'self'   un <form> inyectado no puede enviar datos fuera.
    #   frame-ancestors 'none'  nadie puede meter StreamBox en un <iframe>
    #                        (clickjacking). Sustituye a X-Frame-Options.
    # Los vídeos (videoUrl https://...) no se cargan en la página: se abren
    # en otra pestaña con un enlace normal, que la CSP no limita.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- X-Frame-Options ---
    # Lo mismo que frame-ancestors 'none', para navegadores antiguos que no
    # entienden la CSP. Los modernos dan prioridad a frame-ancestors.
    add_header X-Frame-Options "DENY" always;

    # --- X-Content-Type-Options ---
    # El navegador respeta el Content-Type y no "adivina" el tipo por el
    # contenido: un archivo de texto o una imagen nunca se ejecutará como
    # JavaScript o se pintará como HTML.
    add_header X-Content-Type-Options "nosniff" always;

    # --- Referrer-Policy ---
    # Qué URL de origen se envía en la cabecera Referer. Con
    # strict-origin-when-cross-origin, a otros sitios (los servidores de
    # las portadas https://) solo llega el origen (http://localhost:8088),
    # nunca la ruta (/series/7, /admin/...), y nada si se baja de HTTPS a
    # HTTP. Es el valor por defecto de los navegadores actuales; se fija
    # para no depender de ello. no-referrer sería más estricto, pero algunos
    # servidores de imágenes rechazan peticiones sin Referer (antihotlinking)
    # y la ruta, que es lo sensible, ya no sale. Los enlaces a vídeos llevan
    # además rel="noreferrer" (WatchButton) y no envían nada.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Permissions-Policy ---
    # Desactiva APIs del navegador que StreamBox no usa: aunque se colara un
    # script, no podría pedir la cámara, el micrófono, la ubicación, pagos,
    # USB... "()" = denegado para todos los orígenes (también los iframes).
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=(), browsing-topics=()" always;

    # --- Cross-Origin-Opener-Policy ---
    # La ventana de StreamBox no comparte "grupo de navegación" con ventanas
    # de otros orígenes: una página que la abra (window.open) o que ella abra
    # no puede manipularla mediante window.opener. Mitiga ataques de tipo
    # Spectre y "tabnabbing". No rompe nada: la app no usa window.open ni
    # ventanas emergentes de terceros (login con Google, pasarelas de pago).
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # --- Cross-Origin-Resource-Policy ---
    # Otros sitios no pueden incrustar nuestros recursos (JS, portadas, JSON
    # de la API) con <img>/<script>: el navegador los bloquea. Solo afecta a
    # peticiones de OTROS orígenes; StreamBox carga los suyos sin problema.
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # --- Strict-Transport-Security (HSTS): DESACTIVADO a propósito ---
    # Obliga al navegador a usar siempre HTTPS con este dominio. Hoy nginx
    # sirve por HTTP (127.0.0.1:8088): los navegadores IGNORAN el HSTS que
    # llega por HTTP (RFC 6797), así que no protegería nada y solo
    # confundiría a quien lea las cabeceras. Actívalo cuando haya HTTPS de
    # verdad (un dominio con certificado, aquí o en un proxy delante) y
    # SOLO en la respuesta HTTPS. Empieza con un max-age corto (p. ej. 300)
    # y súbelo cuando todo funcione: un error con un max-age de un año deja
    # el sitio inaccesible por HTTP durante un año en cada navegador.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- Rutas con ";" ----------
    # Defensa en profundidad: ninguna ruta legítima de StreamBox lleva ";"
    # (ni la SPA, ni los recursos, ni la API). En Java, ";" separa los
    # "parámetros de ruta" (/api/..;/actuator) y es un truco clásico para
    # saltarse reglas de seguridad por ruta: nginx ve "/api/..." y lo
    # reenvía, pero Tomcat podría interpretar otra ruta. Hoy lo para el
    # firewall de Spring Security (StrictHttpFirewall); con esto ni siquiera
    # llega al backend. Se mira la ruta tal cual llegó ($request_uri, antes
    # del "?"), en claro o codificada (%3B); la query string no se toca.
    # "if" + "return" a nivel de server es el uso seguro de "if" en nginx.
    if ($request_uri ~* "^[^?]*(;|%3b)") {
        return 400;
    }

    # Comprobación de vida del propio nginx (HEALTHCHECK del Dockerfile). No
    # depende del backend a propósito: nginx está "sano" si sirve archivos;
    # que el backend esté listo ya lo garantiza depends_on en compose. Es
    # público pero no revela nada (solo "ok") y no ensucia el log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- Proxy de la API ----------
    # Sin URI en proxy_pass: la ruta se envía TAL CUAL llegó (sin decodificar
    # ni normalizar), que es lo que espera la seguridad del backend.
    # Las respuestas de error (401, 403, 429 con Retry-After, cuerpo JSON)
    # pasan intactas: nginx solo las sustituiría con proxy_intercept_errors,
    # que está desactivado por defecto.
    # /actuator NO se publica: solo /api/ llega al backend; /actuator/...
    # cae en la SPA de abajo y devuelve index.html. El HEALTHCHECK del
    # backend lo usa Docker desde dentro de su contenedor, sin pasar por aquí.
    location /api/ {
        proxy_pass http://streambox_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Si el backend está caído o reiniciándose, responder 502/504 en
        # pocos segundos en vez de los 60 s por defecto: el usuario ve antes
        # el error (con «Reintentar») y nginx no acumula conexiones colgadas.
        # Solo limita el ESTABLECER la conexión, no la duración de la petición.
        proxy_connect_timeout 5s;

        # ⚠ Seguridad: el backend (perfil prod, forward-headers-strategy=
        # native) toma la IP del cliente de X-Forwarded-For y con ella
        # aplica el límite de intentos de login y registro por IP.
        # Se FIJA con $remote_addr (la IP que ve nginx) y NO se usa
        # $proxy_add_x_forwarded_for: este añade la IP al final de lo que
        # mande el cliente, y un atacante podría inventarse la cabecera en
        # cada petición para parecer siempre una IP nueva y saltarse el límite.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # Esquema con el que llegó la petición a nginx (hoy http). Si algún
        # día hay un proxy con HTTPS delante, habrá que propagar el suyo.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        # Tomcat también lee X-Forwarded-Host/-Port: se fija uno y se borra
        # el otro (valor vacío = no se envía) para que tampoco se puedan
        # falsificar. Forwarded (RFC 7239) no lo usa el backend: se borra.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";

        # Spring Security ya envía X-Content-Type-Options y X-Frame-Options
        # (con los mismos valores) y nginx las vuelve a añadir a nivel de
        # server: sin esto irían DOS veces, y una cabecera repetida se
        # combina como "nosniff, nosniff", que algún navegador podría no
        # entender. Se quita la del backend y queda una sola, la de nginx,
        # igual en toda la aplicación. (proxy_hide_header no es add_header:
        # no rompe la herencia de las cabeceras del server.)
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    # ---------- Recursos estáticos ----------
    # Si un recurso no existe, 404 y NO index.html. Tras un despliegue, un
    # navegador con el index.html antiguo pediría index-ANTIGUO.js: con el
    # fallback de la SPA recibiría HTML con código 200 y el error sería un
    # confuso "MIME type text/html"; además el map le pondría caché de un
    # año a esa respuesta errónea. Para las portadas, el 404 hace que
    # MoviePoster muestre su imagen de respaldo.
    location /assets/ {
        try_files $uri =404;
    }

    location /covers/ {
        try_files $uri =404;
    }

    # ---------- SPA ----------
    # React Router gestiona las rutas en el navegador. Si se recarga
    # /series/7 o /admin/peliculas no existe ese archivo en disco: se
    # devuelve index.html y React Router pinta la página correcta (las rutas
    # inexistentes las redirige la propia app a la portada).
    location / {
        try_files $uri /index.html;
    }
}
